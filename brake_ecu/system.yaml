# ARForge: Top-level Brake ECU showcase system.
# The system combines a reusable Brake Control subcomposition with top-level
# diagnostics and logging SWCs plus small input/mode providers.
system:
  name: "BrakeEcuShowcaseSystem"
  description: "Brake ECU showcase system with a reusable brake-control subcomposition, top-level diagnostics, and status logging."
  composition:
    name: "Composition_BrakeEcuShowcase"
    description: "Top-level Brake ECU composition used for validation, ARXML export, and diagram generation."
    components:
      - name: "BrakeControl_0"
        description: "Reusable brake control subcomposition instance."
        typeRef: "SubComposition_BrakeControl"
      - name: "DiagManager_0"
        description: "Top-level diagnostic service provider."
        typeRef: "DiagManager"
      - name: "PowerStateProvider_0"
        description: "Top-level mode provider."
        typeRef: "PowerStateProvider"
      - name: "StatusLogger_0"
        description: "Top-level status logger and diagnostics client."
        typeRef: "StatusLogger"
      - name: "VehicleStateProvider_0"
        description: "Top-level input provider for wheel speeds and pedal position."
        typeRef: "VehicleStateProvider"
    connectors:
      - from: "BrakeControl_0.Pp_BrakeEnableOut"
        description: "Forwards the controller enable output into the logger's implicit receiver."
        to: "StatusLogger_0.Rp_BrakeEnable"
      - from: "BrakeControl_0.Pp_BrakeStatusOut"
        description: "Forwards brake status into the diagnostic manager."
        to: "DiagManager_0.Rp_BrakeStatus"
      - from: "BrakeControl_0.Pp_BrakeStatusOut"
        description: "Forwards brake status into the logger's queued receiver."
        to: "StatusLogger_0.Rp_BrakeStatusQueued"
      - from: "BrakeControl_0.Pp_BrakeTorqueRequestOut"
        description: "Forwards the torque request into the logger."
        to: "StatusLogger_0.Rp_BrakeTorqueRequest"
      - from: "BrakeControl_0.Pp_SlipRatioOut"
        description: "Forwards the slip estimate into the diagnostic manager."
        to: "DiagManager_0.Rp_SlipRatio"
      - from: "BrakeControl_0.Pp_SlipRatioOut"
        description: "Forwards the slip estimate into the logger."
        to: "StatusLogger_0.Rp_SlipRatio"
      - from: "DiagManager_0.Pp_BrakeDiagnostics"
        description: "Connects the diagnostic service provider to the logger client."
        to: "StatusLogger_0.Rp_BrakeDiagnostics"
      - from: "PowerStateProvider_0.Pp_BrakeEcuMode"
        description: "Distributes the ECU mode to the reusable brake control subcomposition."
        to: "BrakeControl_0.Rp_BrakeEcuModeIn"
      - from: "PowerStateProvider_0.Pp_BrakeEcuMode"
        description: "Distributes the ECU mode to diagnostics."
        to: "DiagManager_0.Rp_BrakeEcuMode"
      - from: "PowerStateProvider_0.Pp_BrakeEcuMode"
        description: "Distributes the ECU mode to the logger."
        to: "StatusLogger_0.Rp_BrakeEcuMode"
      - from: "VehicleStateProvider_0.Pp_BrakePedal"
        description: "Provides the top-level pedal input to the reusable brake control subcomposition."
        to: "BrakeControl_0.Rp_BrakePedalIn"
      - from: "VehicleStateProvider_0.Pp_WheelSpeedFrontLeft"
        description: "Provides the top-level front-left wheel-speed input to the reusable brake control subcomposition."
        to: "BrakeControl_0.Rp_WheelSpeedFrontLeftIn"
      - from: "VehicleStateProvider_0.Pp_WheelSpeedFrontRight"
        description: "Provides the top-level front-right wheel-speed input to the reusable brake control subcomposition."
        to: "BrakeControl_0.Rp_WheelSpeedFrontRightIn"
