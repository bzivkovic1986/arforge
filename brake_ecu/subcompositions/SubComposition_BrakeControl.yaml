# ARForge: Main reusable Brake Control subcomposition.
# It keeps the inner acquisition, estimation, supervision, and torque-control
# chain together while exposing a clean top-level composition contract.
subcomposition:
  name: "SubComposition_BrakeControl"
  description: "Reusable brake control cluster with delegated raw inputs, internal estimation and plausibility logic, and exported brake outputs."
  ports:
    - name: "Pp_BrakeEnableOut"
      description: "Outer brake-enable output delegated from the controller."
      direction: "provides"
      interfaceRef: "If_BrakeEnable"
    - name: "Pp_BrakeStatusOut"
      description: "Outer brake-status output delegated from the plausibility monitor."
      direction: "provides"
      interfaceRef: "If_BrakeStatus"
    - name: "Pp_BrakeTorqueRequestOut"
      description: "Outer brake torque request delegated from the controller."
      direction: "provides"
      interfaceRef: "If_BrakeTorqueRequest"
    - name: "Pp_SlipRatioOut"
      description: "Outer slip-ratio output delegated from the slip estimator."
      direction: "provides"
      interfaceRef: "If_SlipRatio"
    - name: "Rp_BrakeEcuModeIn"
      description: "Outer Brake ECU mode delegated to the inner controller."
      direction: "requires"
      interfaceRef: "If_BrakeEcuMode"
    - name: "Rp_BrakePedalIn"
      description: "Outer brake pedal input delegated to the inner pedal sensor."
      direction: "requires"
      interfaceRef: "If_BrakePedal"
    - name: "Rp_WheelSpeedFrontLeftIn"
      description: "Outer front-left wheel-speed input delegated to the inner sensor conditioner."
      direction: "requires"
      interfaceRef: "If_WheelSpeed"
    - name: "Rp_WheelSpeedFrontRightIn"
      description: "Outer front-right wheel-speed input delegated to the inner sensor conditioner."
      direction: "requires"
      interfaceRef: "If_WheelSpeed"
  components:
    - name: "BrakePedalSensor_1"
      description: "Internal brake pedal conditioning instance."
      typeRef: "BrakePedalSensor"
    - name: "BrakePlausibilityMonitor_1"
      description: "Internal plausibility monitor instance."
      typeRef: "BrakePlausibilityMonitor"
    - name: "BrakeTorqueController_1"
      description: "Internal torque controller instance."
      typeRef: "BrakeTorqueController"
    - name: "SlipEstimator_1"
      description: "Internal slip estimator instance."
      typeRef: "SlipEstimator"
    - name: "WheelSpeedFrontLeft_1"
      description: "Internal front-left wheel-speed conditioning instance."
      typeRef: "WheelSpeedFrontLeft"
    - name: "WheelSpeedFrontRight_1"
      description: "Internal front-right wheel-speed conditioning instance."
      typeRef: "WheelSpeedFrontRight"
  connectors:
    - from: "BrakePedalSensor_1.Pp_BrakePedal"
      description: "Feeds the conditioned pedal value into the plausibility monitor."
      to: "BrakePlausibilityMonitor_1.Rp_BrakePedal"
    - from: "BrakePedalSensor_1.Pp_BrakePedal"
      description: "Feeds the conditioned pedal value into the torque controller."
      to: "BrakeTorqueController_1.Rp_BrakePedal"
    - from: "BrakePedalSensor_1.Pp_BrakePedal"
      description: "Feeds the conditioned pedal value into the slip estimator."
      to: "SlipEstimator_1.Rp_BrakePedal"
    - from: "BrakePlausibilityMonitor_1.Pp_BrakeStatus"
      description: "Feeds the monitored brake status back into the controller."
      to: "BrakeTorqueController_1.Rp_BrakeStatus"
    - from: "BrakeTorqueController_1.Pp_BrakeEcuMode"
      description: "Distributes the controller mode to the plausibility monitor."
      to: "BrakePlausibilityMonitor_1.Rp_BrakeEcuMode"
    - from: "SlipEstimator_1.Pp_SlipRatio"
      description: "Feeds the slip estimate into the torque controller."
      to: "BrakeTorqueController_1.Rp_SlipRatio"
    - from: "WheelSpeedFrontLeft_1.Pp_WheelSpeedFrontLeft"
      description: "Feeds the conditioned front-left wheel speed into the plausibility monitor."
      to: "BrakePlausibilityMonitor_1.Rp_WheelSpeedFrontLeft"
    - from: "WheelSpeedFrontLeft_1.Pp_WheelSpeedFrontLeft"
      description: "Feeds the conditioned front-left wheel speed into the slip estimator."
      to: "SlipEstimator_1.Rp_WheelSpeedFrontLeft"
    - from: "WheelSpeedFrontRight_1.Pp_WheelSpeedFrontRight"
      description: "Feeds the conditioned front-right wheel speed into the plausibility monitor."
      to: "BrakePlausibilityMonitor_1.Rp_WheelSpeedFrontRight"
    - from: "WheelSpeedFrontRight_1.Pp_WheelSpeedFrontRight"
      description: "Feeds the conditioned front-right wheel speed into the implicit slip-estimator input."
      to: "SlipEstimator_1.Rp_WheelSpeedFrontRightImplicit"
  delegationConnectors:
    - inner: "BrakePedalSensor_1.Rp_BrakePedalRawIn"
      outer: "Rp_BrakePedalIn"
    - inner: "BrakePlausibilityMonitor_1.Pp_BrakeStatus"
      outer: "Pp_BrakeStatusOut"
    - inner: "BrakeTorqueController_1.Pp_BrakeEnable"
      outer: "Pp_BrakeEnableOut"
    - inner: "BrakeTorqueController_1.Pp_BrakeTorqueRequest"
      outer: "Pp_BrakeTorqueRequestOut"
    - inner: "BrakeTorqueController_1.Rp_BrakeEcuModeIn"
      outer: "Rp_BrakeEcuModeIn"
    - inner: "SlipEstimator_1.Pp_SlipRatio"
      outer: "Pp_SlipRatioOut"
    - inner: "WheelSpeedFrontLeft_1.Rp_WheelSpeedRawIn"
      outer: "Rp_WheelSpeedFrontLeftIn"
    - inner: "WheelSpeedFrontRight_1.Rp_WheelSpeedRawIn"
      outer: "Rp_WheelSpeedFrontRightIn"
