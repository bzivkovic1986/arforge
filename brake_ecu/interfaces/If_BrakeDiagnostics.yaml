# ARForge: Diagnostic service contract for the Brake ECU showcase.
interface:
  name: "If_BrakeDiagnostics"
  description: "Client-server interface exposing brake ECU status and maintenance services."
  type: "clientServer"
  operations:
    - name: "GetBrakeStatus"
      description: "Returns the current brake status value."
      returnType: "App_BrakeStatus"
    - name: "GetCurrentMode"
      description: "Returns the current ECU mode as a diagnostic-friendly enum."
      returnType: "App_EcuMode"
    - name: "GetDiagnosticSnapshot"
      description: "Returns a compressed diagnostic snapshot."
      returnType: "App_DiagnosticStatus"
    - name: "ResetPlausibilityFault"
      description: "Clears the plausibility monitor latch when service conditions allow it."
      arguments:
        - name: "RequesterId"
          direction: "in"
          typeRef: "UInt8"
      returnType: "void"
      possibleErrors:
        - name: "REQUEST_DENIED"
          code: 1
