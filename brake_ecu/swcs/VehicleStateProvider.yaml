# ARForge: Synthetic vehicle input provider SWC for the showcase project.
swc:
  name: "VehicleStateProvider"
  description: "Publishes the brake-pedal input that feeds the reusable Brake Control subcomposition."
  runnables:
    - name: "Runnable_PublishBrakeInputs"
      description: "Publishes the normalized brake-pedal input for the reusable brake-control path."
      timingEventMs: 5
      writes:
        - port: "Pp_BrakePedal"
          dataElement: "BrakePedalPosition"
  ports:
    - name: "Pp_BrakePedal"
      description: "Top-level brake pedal source."
      direction: "provides"
      interfaceRef: "If_BrakePedal"
